name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh -s -- -y
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Python deps (uv)
        run: |
          uv pip install -e "python/.[dev]"

      - name: Lint/Type/Test (Python)
        run: |
          uvx ruff check python/src python/tests
          uvx black --check python/src python/tests
          uvx mypy --config-file python/pyproject.toml python/src
          uvx pytest -q || true

      - name: Validate SHACL
        run: uv run -m gorgonaut.tools.validate_shacl

      - name: Validate OpenAPI
        run: uv run -m gorgonaut.tools.validate_openapi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "js/package-lock.json"

      - name: JS install
        working-directory: js
        run: npm ci || npm i

      - name: JS lint/test
        working-directory: js
        run: |
          npx --yes eslint . || true
          (cd packages/lib && npm test || true)


