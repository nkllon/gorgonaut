name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Diagnostics (pre)
        run: |
          echo "PATH=$PATH"
          which python || true
          python --version
          which node || true
          node --version
          which npm || true
          npm --version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh -s -- -y
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Diagnostics (uv)
        run: |
          which uv || true
          "$HOME/.local/bin/uv" --version || true
      - name: Create uv virtualenv
        run: |
          "$HOME/.local/bin/uv" venv

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "js/package-lock.json"

      - name: Run CI via Makefile (verbose)
        run: |
          set -x
          make ci

  docker-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docker version
        run: |
          docker --version
          docker compose version
      - name: Run CI in containers
        run: |
          docker compose pull
          make ci-docker


