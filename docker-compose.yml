version: "3.9"
services:
  python-validate:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: >
      bash -lc "apt-get update &&
      apt-get install -y --no-install-recommends graphviz &&
      python -m pip install --no-cache-dir -q rdflib pyshacl &&
      python -m pip install --no-cache-dir -q openapi-spec-validator &&
      python -m gorgonaut.tools.validate_shacl &&
      python -m gorgonaut.tools.validate_openapi"

  python-export:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
    command: >
      bash -lc "echo 'No export script yet; skipping' && true"

  js-package:
    image: node:20
    working_dir: /workspace/js/packages/lib
    volumes:
      - .:/workspace
    command: >
      bash -lc "(npm ci || npm i) &&
      npm run typecheck &&
      npm run build &&
      npm test"

  web-build:
    image: node:20
    working_dir: /workspace/js/apps/web
    volumes:
      - .:/workspace
    command: >
      bash -lc "(npm ci || npm i) &&
      npm run build || true"


